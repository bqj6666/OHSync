name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ohsync-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 打 tag 时出正式发行版。签名密钥来自仓库 Secrets；
      # 未配置时仍会构建（只是不签名），避免 fork 的 CI 挂掉。
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          OHSYNC_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          OHSYNC_KEYSTORE_PASSWORD: ${{ secrets.OHSYNC_KEYSTORE_PASSWORD }}
          OHSYNC_KEY_ALIAS: ${{ secrets.OHSYNC_KEY_ALIAS }}
          OHSYNC_KEY_PASSWORD: ${{ secrets.OHSYNC_KEY_PASSWORD }}
        run: |
          if [ -n "$OHSYNC_KEYSTORE_PASSWORD" ]; then
            echo "${{ secrets.OHSYNC_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          fi
          ./gradlew :app:assembleRelease --no-daemon

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          name: OHSync ${{ github.ref_name }}
